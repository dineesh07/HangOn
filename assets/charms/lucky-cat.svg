<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldCat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="redCollar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 5)">
    <!-- Top Hanging Ring -->
    <circle cx="100" cy="18" r="9" fill="none" stroke="#eab308" stroke-width="4"/>

    <!-- Left Ear -->
    <polygon points="56,72 68,36 92,65" fill="url(#goldCat)"/>
    <polygon points="62,70 70,43 87,66" fill="#f43f5e"/>

    <!-- Right Ear -->
    <polygon points="144,72 132,36 108,65" fill="url(#goldCat)"/>
    <polygon points="138,70 130,43 113,66" fill="#f43f5e"/>

    <!-- Body & Head -->
    <ellipse cx="100" cy="122" rx="54" ry="58" fill="url(#goldCat)"/>
    <circle cx="100" cy="88" r="45" fill="url(#goldCat)"/>

    <!-- Waving Left Paw -->
    <ellipse cx="54" cy="60" rx="14" ry="22" fill="url(#goldCat)" transform="rotate(-20 54 60)"/>
    <circle cx="50" cy="46" r="11" fill="#fef08a"/>
    <ellipse cx="49" cy="46" rx="5" ry="4" fill="#f43f5e"/>
    <circle cx="45" cy="40" r="1.8" fill="#f43f5e"/>
    <circle cx="50" cy="38" r="1.8" fill="#f43f5e"/>
    <circle cx="55" cy="41" r="1.8" fill="#f43f5e"/>

    <!-- Red Collar with Gold Bell -->
    <path d="M 72,110 Q 100,124 128,110 Q 100,132 72,110 Z" fill="url(#redCollar)"/>
    <circle cx="100" cy="124" r="8" fill="#fde047" stroke="#ca8a04" stroke-width="1.8"/>
    <circle cx="100" cy="126" r="1.8" fill="#854d0e"/>

    <!-- Face Features -->
    <path d="M 78,84 Q 86,77 94,84" fill="none" stroke="#1c1917" stroke-width="3" stroke-linecap="round"/>
    <path d="M 106,84 Q 114,77 122,84" fill="none" stroke="#1c1917" stroke-width="3" stroke-linecap="round"/>

    <ellipse cx="100" cy="91" rx="3" ry="2.2" fill="#f43f5e"/>
    <path d="M 100,93 Q 95,99 90,96 M 100,93 Q 105,99 110,96" fill="none" stroke="#1c1917" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="64" y1="88" x2="48" y2="85" stroke="#78350f" stroke-width="1.8"/>
    <line x1="64" y1="93" x2="46" y2="95" stroke="#78350f" stroke-width="1.8"/>
    <line x1="136" y1="88" x2="152" y2="85" stroke="#78350f" stroke-width="1.8"/>
    <line x1="136" y1="93" x2="154" y2="95" stroke="#78350f" stroke-width="1.8"/>

    <!-- Golden Coin -->
    <ellipse cx="118" cy="144" rx="18" ry="24" fill="url(#coinGrad)" stroke="#ca8a04" stroke-width="1.8" transform="rotate(15 118 144)"/>
    <text x="118" y="149" font-size="12" font-weight="900" fill="#78350f" text-anchor="middle" font-family="sans-serif">萬</text>

    <!-- Right Paw -->
    <circle cx="132" cy="138" r="10" fill="url(#goldCat)"/>
  </g>
</svg>
