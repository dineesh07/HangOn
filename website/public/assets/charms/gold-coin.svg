<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="brassGold" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>
    <linearGradient id="redKnot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 3)">
    <!-- Red Chinese Mystic Knot at top -->
    <path d="M 92,14 C 92,4 108,4 108,14 C 108,24 92,24 92,14 Z" fill="none" stroke="url(#redKnot)" stroke-width="3.5"/>
    <rect x="90" y="20" width="20" height="12" rx="3" fill="url(#redKnot)"/>
    <circle cx="100" cy="26" r="2.5" fill="#fde047"/>

    <!-- Main Golden Coin -->
    <circle cx="100" cy="95" r="62" fill="url(#brassGold)"/>
    <circle cx="100" cy="95" r="58" fill="none" stroke="#713f12" stroke-width="1.8" opacity="0.6"/>
    <circle cx="100" cy="95" r="55" fill="none" stroke="#fef08a" stroke-width="1.2" opacity="0.8"/>

    <!-- Inner Square Hole -->
    <rect x="85" y="80" width="30" height="30" rx="2.5" fill="#18181b" stroke="#713f12" stroke-width="2.5"/>

    <!-- Traditional Four Characters -->
    <text x="100" y="62" font-family="'SimHei', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="900" fill="#713f12" text-anchor="middle">招</text>
    <text x="100" y="137" font-family="'SimHei', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="900" fill="#713f12" text-anchor="middle">寶</text>
    <text x="63" y="101" font-family="'SimHei', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="900" fill="#713f12" text-anchor="middle">進</text>
    <text x="137" y="101" font-family="'SimHei', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="900" fill="#713f12" text-anchor="middle">財</text>

    <!-- Bevel Shine -->
    <path d="M 52,58 A 54,54 0 0,1 148,58 A 52,52 0 0,0 52,58 Z" fill="#ffffff" opacity="0.4"/>

    <!-- Bottom Red Silk Tassel -->
    <path d="M 96,155 L 93,184 L 107,184 L 104,155 Z" fill="url(#redKnot)"/>
    <circle cx="100" cy="157" r="4.5" fill="#fde047"/>
  </g>
</svg>
