<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cryst1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="cryst2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="60%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="cryst3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 4)">
    <!-- Top Attachment Loop -->
    <circle cx="100" cy="18" r="8" fill="none" stroke="url(#goldCap)" stroke-width="3.5"/>

    <!-- Filigree Metallic Cap -->
    <path d="M 76,46 Q 100,56 124,46 L 118,34 Q 100,30 82,34 Z" fill="url(#goldCap)"/>
    <circle cx="100" cy="40" r="2.8" fill="#fef08a"/>

    <!-- Geometric Crystal Facets -->
    <polygon points="100,50 122,74 100,175 78,74" fill="url(#cryst1)"/>
    <polygon points="78,74 100,50 64,64 56,120 100,175" fill="url(#cryst3)"/>
    <polygon points="122,74 100,50 136,64 144,120 100,175" fill="url(#cryst2)"/>

    <!-- Cut highlights -->
    <polygon points="100,50 64,64 78,74" fill="#f3e8ff" opacity="0.6"/>
    <polygon points="100,50 136,64 122,74" fill="#ffffff" opacity="0.8"/>

    <!-- Center Ridge Highlight -->
    <line x1="100" y1="50" x2="100" y2="175" stroke="#ffffff" stroke-width="1.8" opacity="0.75"/>
    <line x1="100" y1="50" x2="122" y2="74" stroke="#ffffff" stroke-width="1.2" opacity="0.85"/>

    <!-- Sparkle Star -->
    <path d="M 122,74 Q 122,66 118,66 Q 122,66 122,58 Q 122,66 126,66 Q 122,66 122,74 Z" fill="#ffffff"/>
    <circle cx="122, 66" r="1.8" fill="#ffffff"/>
  </g>
</svg>
